name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · i18n · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dictionary parity (fr / en / de / es)
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Contact transport is not configured in CI; the route still builds.
          CONTACT_PLACEHOLDER: "1"

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high
